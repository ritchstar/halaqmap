<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مقارنة ألوان الثيمات</title>
<style>
  body { font-family: 'Tahoma', sans-serif; background:#f5f5f5; margin:0; padding:24px; }
  h1 { font-size:20px; margin-bottom:4px; }
  p.sub { color:#666; margin-top:0; margin-bottom:24px; font-size:14px; }
  .product { background:#fff; border-radius:12px; padding:16px; margin-bottom:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .product h2 { margin:0 0 12px; font-size:17px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .col { flex:1; min-width:260px; }
  .col h3 { font-size:13px; color:#888; margin:0 0 8px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { width:70px; }
  .swatch { height:48px; border-radius:8px; border:1px solid rgba(0,0,0,.08); }
  .label { font-size:10px; color:#555; text-align:center; margin-top:3px; }
  .card-demo { border-radius:10px; padding:14px; margin-top:8px; }
  .card-demo .btn { display:inline-block; padding:6px 14px; border-radius:8px; font-size:13px; font-weight:700; margin-top:8px; }
</style>
</head>
<body>
<h1>مقارنة: قبل / بعد تحديث ألوان الثيمات (المنتجات الأربعة)</h1>
<p class="sub">كل الألوان تأتي من ملف واحد فقط: src/config/storeProductThemes.ts — لم يتم لمس أي كود منطقي.</p>

<div id="app"></div>

<script>
const OLD = {
  halana: { storefront:{pageBg:'#F7EFE9',surface:'#FFF9F5',surfaceAlt:'#F1E1DE',text:'#341D27',muted:'#745E66',accent:'#A84465'} },
  kitchen: { storefront:{pageBg:'#F3E5D3',surface:'#FFF8EF',surfaceAlt:'#E8D5BE',text:'#30231B',muted:'#746457',accent:'#B65F3F'} },
  produce: { storefront:{pageBg:'#E9F1E6',surface:'#F8FBF6',surfaceAlt:'#DCE8D8',text:'#1F2E22',muted:'#5A6B5E',accent:'#34734A'} },
  grocers: { storefront:{pageBg:'#E5F0EF',surface:'#F7FBFA',surfaceAlt:'#D4E6E4',text:'#1F2A2C',muted:'#5C6B6E',accent:'#167E78'} },
};
const NEW = {
  halana: { storefront:{pageBg:'#F7F2EC',surface:'#FFFBF7',surfaceAlt:'#F0E2DE',text:'#3A2227',muted:'#7A5F63',accent:'#B3426D'}, name:'حلانا1 (حلويات منزلية)' },
  kitchen: { storefront:{pageBg:'#F4E6D2',surface:'#FFF8EF',surfaceAlt:'#E9D3B0',text:'#2A1E14',muted:'#6E5A47',accent:'#C2410C'}, name:'طبختنا1 (طبخ منزلي)' },
  produce: { storefront:{pageBg:'#F4F1E8',surface:'#FBFAF5',surfaceAlt:'#E7E4D6',text:'#20352B',muted:'#5C6B5F',accent:'#3F7440'}, name:'خضارنا1 (خضار وفواكه)' },
  grocers: { storefront:{pageBg:'#F8FAFC',surface:'#FFFFFF',surfaceAlt:'#E2E8F0',text:'#0F172A',muted:'#475569',accent:'#1D4ED8'}, name:'تمويناتا1 (تموينات)' },
};
const order = ['halana','kitchen','produce','grocers'];
const app = document.getElementById('app');
order.forEach(key => {
  const o = OLD[key].storefront, n = NEW[key].storefront;
  const section = document.createElement('div');
  section.className = 'product';
  function chips(tokens){
    return Object.entries(tokens).map(([k,v]) => `
      <div class="chip">
        <div class="swatch" style="background:${v}"></div>
        <div class="label">${k}</div>
      </div>`).join('');
  }
  section.innerHTML = `
    <h2>${NEW[key].name} — ${key}</h2>
    <div class="row">
      <div class="col">
        <h3>قبل</h3>
        <div class="chips">${chips(o)}</div>
        <div class="card-demo" style="background:${o.surface}; border:1px solid ${o.surfaceAlt}; color:${o.text}">
          بطاقة عرض تجريبية — نص عادي هنا
          <div class="btn" style="background:${o.accent}; color:#fff">زر رئيسي</div>
        </div>
      </div>
      <div class="col">
        <h3>بعد (تصميم Chatly)</h3>
        <div class="chips">${chips(n)}</div>
        <div class="card-demo" style="background:${n.surface}; border:1px solid ${n.surfaceAlt}; color:${n.text}">
          بطاقة عرض تجريبية — نص عادي هنا
          <div class="btn" style="background:${n.accent}; color:#fff">زر رئيسي</div>
        </div>
      </div>
    </div>
  `;
  app.appendChild(section);
});
</script>
</body>
</html>
