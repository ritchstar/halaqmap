# بناء وأرشفة غلاف المستخدم iOS (com.halaqmap.consumer) على macOS runner
# ورفع IPA إلى App Store Connect عبر مفتاح API — بدون Mac محلي.
#
# التشغيل الافتراضي: يدوي (workflow_dispatch) لتوفير دقائق macOS.
# macOS يخصم ~10× من رصيد الدقائق في المستودعات الخاصة.
name: iOS Consumer App Store

on:
  workflow_dispatch:
    inputs:
      upload:
        description: رفع IPA إلى App Store Connect / TestFlight
        type: boolean
        default: true
      marketing_version:
        description: رقم الإصدار الظاهر (مثلاً 1.0.0) — اتركه فارغاً للإبقاء على قيمة المشروع
        type: string
        required: false
        default: ""
      build_number:
        description: رقم البناء (CFBundleVersion) — اتركه فارغاً لاستخدام رقم تشغيل Actions
        type: string
        required: false
        default: ""

concurrency:
  group: ios-consumer-appstore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-archive-upload:
    name: Archive & Upload (macOS)
    runs-on: macos-14
    timeout-minutes: 75
    env:
      APP_BUNDLE_ID: com.halaqmap.consumer
      WORK_DIR: ${{ github.workspace }}
      IOS_PROJECT: ios/App/App.xcodeproj
      IOS_SCHEME: App
      ARCHIVE_PATH: ${{ github.workspace }}/build/HalaqMap-Consumer.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      AUTH_KEY_DIR: ${{ github.workspace }}/build/private_keys
      NODE_OPTIONS: --use-system-ca

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          missing=0
          for name in IOS_DEVELOPMENT_TEAM APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing. See ios/CI-GITHUB-ACTIONS.md"
              missing=1
            fi
          done
          exit $missing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare Capacitor iOS shell + sync
        run: npm run ios:sync

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -project "$IOS_PROJECT" -list

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME"

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          mkdir -p "$AUTH_KEY_DIR"
          KEY_PATH="$AUTH_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "AUTH_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          # مسارات يبحث عنها altool تلقائياً
          mkdir -p "$HOME/private_keys" "$HOME/.appstoreconnect/private_keys" "./private_keys"
          cp "$KEY_PATH" "$HOME/private_keys/"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/"
          cp "$KEY_PATH" "./private_keys/"

      - name: Compute version numbers
        id: versions
        run: |
          MARKETING="${{ inputs.marketing_version }}"
          BUILD="${{ inputs.build_number }}"
          if [ -z "$BUILD" ]; then
            BUILD="${{ github.run_number }}"
          fi
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"
          if [ -n "$MARKETING" ]; then
            echo "marketing_version=$MARKETING" >> "$GITHUB_OUTPUT"
            echo "version_flags=MARKETING_VERSION=$MARKETING CURRENT_PROJECT_VERSION=$BUILD" >> "$GITHUB_OUTPUT"
          else
            echo "marketing_version=(project)" >> "$GITHUB_OUTPUT"
            echo "version_flags=CURRENT_PROJECT_VERSION=$BUILD" >> "$GITHUB_OUTPUT"
          fi
          echo "Build number: $BUILD | Marketing: ${MARKETING:-from project}"

      - name: Archive (Release)
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p build
          # shellcheck disable=SC2086
          xcodebuild archive \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$IOS_DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            ${{ steps.versions.outputs.version_flags }}
          test -d "$ARCHIVE_PATH"

      - name: Export IPA
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p build
          EXPORT_PLIST="$WORK_DIR/build/ExportOptions.ci.plist"
          cp "$WORK_DIR/ios/ExportOptions.plist" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string ${IOS_DEVELOPMENT_TEAM}" "$EXPORT_PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :teamID ${IOS_DEVELOPMENT_TEAM}" "$EXPORT_PLIST"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -allowProvisioningUpdates
          ls -la "$EXPORT_PATH"
          IPA_PATH="$(find "$EXPORT_PATH" -name '*.ipa' | head -n 1)"
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "Exported IPA: $IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: halaqmap-consumer-ios-ipa
          path: ${{ env.EXPORT_PATH }}/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "Uploading $IPA_PATH ..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose
          echo "Upload submitted. Processing continues in App Store Connect / TestFlight."

      - name: Skip upload notice
        if: ${{ !inputs.upload }}
        run: echo "Upload skipped (workflow input upload=false). IPA is available as an artifact."
