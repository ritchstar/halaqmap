          if (path === '/' || path === '') return;
          if (path.indexOf('/api/') === 0) return;
          if (path.indexOf('/oc/') === 0 || path === '/oc') return;
          if (path.indexOf('/c/') === 0 || path === '/c') return;
          /* صفحات SEO جغرافية وثابتة — لا تُحوَّل إلى HashRouter */
          if (path === '/near' || path.indexOf('/near/') === 0) return;
          if (path === '/terms' || path === '/about' || path === '/privacy-policy') return;
          if (/\.[a-zA-Z0-9]{1,12}$/.test(path)) return;
          /* أبقِ ?query على أصل العنوان حتى يقرأ بكسل تيك توك/جوجل ttclid وtt_test_id.
             السابق كان /#/path?query فيُفرَّغ location.search ويضيع اختبار الأحداث والإحالة. */
          var next = '/' + search + '#' + path;
          if (window.location.pathname + window.location.search + window.location.hash === next) return;
          window.history.replaceState(null, '', next);
        } catch (e) {}
      })();
    </script>
    <!-- إن وُضع ttclid/tt_test_id داخل الهاش (اختبار تيك توك / رابط قديم) انسخه إلى location.search قبل تحميل البكسل -->
    <script>
      (function () {
        try {
          var hash = window.location.hash || '';
          var q = hash.indexOf('?');
          if (q < 0) return;
          var hashQuery = hash.slice(q + 1);
          var pathHash = hash.slice(0, q) || '#';
          var hp = new URLSearchParams(hashQuery);
          var sp = new URLSearchParams(window.location.search);
          var keys = [
            'ttclid',
            'tt_test_id',
            'utm_source',
            'utm_medium',
            'utm_campaign',
            'utm_term',
            'utm_content',
            'gclid',
            'gbraid',
            'wbraid',
          ];
          var moved = false;
          for (var i = 0; i < keys.length; i++) {
            var k = keys[i];
            var v = hp.get(k);
            if (v && !sp.get(k)) {
              sp.set(k, v);
              moved = true;
            }
          }
          if (!moved) return;
          for (var j = 0; j < keys.length; j++) hp.delete(keys[j]);
          var remain = hp.toString();
          var qs = sp.toString();
          window.history.replaceState(
            null,
            '',
            window.location.pathname + (qs ? '?' + qs : '') + pathHash + (remain ? '?' + remain : ''),
          );
        } catch (e2) {}
      })();
    </script>
    <!-- HashRouter: إعادة توجيه عودة ميسر/SAB (?id= على أصل الموقع) قبل تحميل React -->
    <script>
      (function () {
        try {
          var paymentPath = '/partners/payment';
          var path = (window.location.pathname || '').replace(/\/+$/, '') || '/';
          var search = window.location.search || '';
          if (path === paymentPath && search) {
            var earlyParams = new URLSearchParams(search);
            var earlyPurpose = (earlyParams.get('purpose') || '').trim();
            var earlyToken = (earlyParams.get('store_card_token') || earlyParams.get('token') || '').trim();
            var earlyWedding = (earlyParams.get('store_wedding_token') || '').trim();
            var earlyEvent = (earlyParams.get('store_event_token') || '').trim();
            var earlyLounge = (earlyParams.get('store_lounge_token') || '').trim();
            var earlyGrocers = (earlyParams.get('store_grocers_token') || '').trim();
            var earlyRestaurant = (earlyParams.get('store_restaurant_token') || '').trim();
            var earlyCafe = (earlyParams.get('store_cafe_token') || '').trim();
            var earlyKitchen = (earlyParams.get('store_kitchen_token') || '').trim();
            var earlyPath =
              earlyPurpose === 'store_occasion_card' && earlyToken
                ? '/pay/occasion-card/' + encodeURIComponent(earlyToken)
                : earlyPurpose === 'store_wedding_live' && (earlyWedding || earlyToken)
                  ? '/pay/wedding/' + encodeURIComponent(earlyWedding || earlyToken)
                  : earlyPurpose === 'store_event_live' && (earlyEvent || earlyToken)
                    ? '/pay/event/' + encodeURIComponent(earlyEvent || earlyToken)
                    : earlyPurpose === 'store_lounge_live' && (earlyLounge || earlyToken)
                      ? '/pay/lounge/' + encodeURIComponent(earlyLounge || earlyToken)
                      : earlyPurpose === 'store_grocers_live' && (earlyGrocers || earlyToken)
                        ? '/pay/grocers/' + encodeURIComponent(earlyGrocers || earlyToken)
                      : earlyPurpose === 'store_restaurant_live' && (earlyRestaurant || earlyToken)
                        ? '/pay/restaurant/' + encodeURIComponent(earlyRestaurant || earlyToken)
                      : earlyPurpose === 'store_cafe_live' && (earlyCafe || earlyToken)
                        ? '/pay/cafe/' + encodeURIComponent(earlyCafe || earlyToken)
                      : earlyPurpose === 'store_kitchen_live' && (earlyKitchen || earlyToken)
                        ? '/pay/kitchen/' + encodeURIComponent(earlyKitchen || earlyToken)
                      : paymentPath;
            var paymentTarget = window.location.origin + '/#' + earlyPath + search;
            if (window.location.href !== paymentTarget) {
              window.location.replace(paymentTarget);
              return;
            }
          }
          if (!search) return;
          var params = new URLSearchParams(search);
          if (params.get('gateway') === 'sab') return;
          var hash = window.location.hash || '';
          var hashPath = hash.replace(/^#/, '').split('?')[0] || '';
          var purpose = (params.get('purpose') || '').trim();
          var storeToken = (params.get('store_card_token') || params.get('token') || '').trim();
          if (purpose === 'store_occasion_card' && storeToken) {
            var occPath = '/pay/occasion-card/' + encodeURIComponent(storeToken);
            if (hashPath === occPath) return;
            window.location.replace(window.location.origin + '/#' + occPath + search);
            return;
          }
          var weddingToken = (params.get('store_wedding_token') || '').trim();
          if (purpose === 'store_wedding_live' && weddingToken) {
            var weddingPath = '/pay/wedding/' + encodeURIComponent(weddingToken);
            if (hashPath === weddingPath) return;
            window.location.replace(window.location.origin + '/#' + weddingPath + search);
            return;
          }
          var eventToken = (params.get('store_event_token') || '').trim();
          if (purpose === 'store_event_live' && eventToken) {
            var eventPath = '/pay/event/' + encodeURIComponent(eventToken);
            if (hashPath === eventPath) return;
            window.location.replace(window.location.origin + '/#' + eventPath + search);
            return;
          }
          var loungeToken = (params.get('store_lounge_token') || '').trim();
          if (purpose === 'store_lounge_live' && loungeToken) {
            var loungePath = '/pay/lounge/' + encodeURIComponent(loungeToken);
            if (hashPath === loungePath) return;
            window.location.replace(window.location.origin + '/#' + loungePath + search);
            return;
          }
          var grocersToken = (params.get('store_grocers_token') || '').trim();
          if (purpose === 'store_grocers_live' && grocersToken) {
            var grocersPath = '/pay/grocers/' + encodeURIComponent(grocersToken);
            if (hashPath === grocersPath) return;
            window.location.replace(window.location.origin + '/#' + grocersPath + search);
            return;
          }
          var restaurantToken = (params.get('store_restaurant_token') || '').trim();
          if (purpose === 'store_restaurant_live' && restaurantToken) {
            var restaurantPath = '/pay/restaurant/' + encodeURIComponent(restaurantToken);
            if (hashPath === restaurantPath) return;
            window.location.replace(window.location.origin + '/#' + restaurantPath + search);
            return;
          }
          var cafeToken = (params.get('store_cafe_token') || '').trim();
          if (purpose === 'store_cafe_live' && cafeToken) {
            var cafePath = '/pay/cafe/' + encodeURIComponent(cafeToken);
            if (hashPath === cafePath) return;
            window.location.replace(window.location.origin + '/#' + cafePath + search);
            return;
          }
          var kitchenToken = (params.get('store_kitchen_token') || '').trim();
          if (purpose === 'store_kitchen_live' && kitchenToken) {
            var kitchenPath = '/pay/kitchen/' + encodeURIComponent(kitchenToken);
            if (hashPath === kitchenPath) return;
            window.location.replace(window.location.origin + '/#' + kitchenPath + search);
            return;
          }
          var hasMoyasarReturn =
            params.get('id') || params.get('status') === 'failed' || params.get('message');
          if (!hasMoyasarReturn) return;
          if (hashPath.indexOf('/pay/occasion-card/') === 0) return;
          if (hashPath.indexOf('/pay/wedding/') === 0) return;
          if (hashPath.indexOf('/pay/event/') === 0) return;
          if (hashPath.indexOf('/pay/lounge/') === 0) return;
          if (hashPath.indexOf('/pay/grocers/') === 0) return;
          if (hashPath.indexOf('/pay/restaurant/') === 0) return;
          if (hashPath.indexOf('/pay/cafe/') === 0) return;
          if (hashPath.indexOf('/pay/kitchen/') === 0) return;
          if (hashPath === paymentPath) return;
          window.location.replace(window.location.origin + '/#' + paymentPath + search);
        } catch (e) {}
      })();
    </script>
    <!-- HashRouter: الروابط الصحيحة للتقييم هي /#/rate/…?t=… — إن فُتحت /rate/… بدون # نُعيد التوجيه قبل تحميل React -->
    <script>
      (function () {
        try {
          var path = window.location.pathname || '';
          var hash = window.location.hash || '';
          if (path.indexOf('/rate/') === 0 && hash.length <= 1) {
            window.location.replace(window.location.origin + '/#' + path + (window.location.search || ''));
          }
        } catch (e) {}
      })();
    </script>
    <!-- شاشة إقلاع للغلاف فقط — لا تُدرج صورة fetchpriority على الموقع العام (تسرق LCP) -->
    <div id="hm-boot-splash" hidden aria-hidden="true"></div>
    <script>
      (function () {
        try {
          var splash = document.getElementById('hm-boot-splash');
          if (!splash) return;
          var hashPath = (window.location.hash || '').replace(/^#/, '').split('?')[0] || '/';
          var standalone =
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            !!window.navigator.standalone;
          var twaOrPartner =
            standalone ||
            hashPath.indexOf('/partners/app') === 0 ||
            hashPath.indexOf('/barber/') === 0 ||
            hashPath.indexOf('/partners/login') === 0;
          if (!twaOrPartner) {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
            return;
          }
          splash.removeAttribute('hidden');
          splash.setAttribute('aria-hidden', 'true');
          splash.style.cssText =
            'position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background:#0a4f4a';
          splash.innerHTML =
            '<div style="width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#2dd4bf,#0d9488);box-shadow:0 0 0 3px rgba(45,212,191,.35)"></div>';
          var hide = function () {
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            splash.style.pointerEvents = 'none';
            window.setTimeout(function () {
              if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            }, 280);
          };
          var root = document.getElementById('root');
          var done = false;
          var finish = function () {
            if (done) return;
            done = true;
            hide();
          };
          if (root) {
            var obs = new MutationObserver(function () {
              if (root.childElementCount > 0) {
                obs.disconnect();
                finish();
              }
            });
            obs.observe(root, { childList: true, subtree: true });
          }
          window.addEventListener('halaqmap:mounted', finish, { once: true });
          window.setTimeout(finish, 4500);
        } catch (e) {}
      })();
    </script>

    <!-- استرداد تلقائي إذا فشل تحميل JS أو CSS بعد نشر جديد (كاش SW/CDN قديم) -->
    <script>
      (function () {
        var key = 'hm-chunk-recover';
        if (sessionStorage.getItem(key)) return;
        window.addEventListener(
          'error',
          function (ev) {
            var t = ev.target;
            if (!t) return;
            var tag = t.tagName;
            var href = '';
            if (tag === 'SCRIPT') href = t.src || '';
            else if (tag === 'LINK' && (t.rel || '').indexOf('stylesheet') !== -1) href = t.href || '';
            else return;
            if (href.indexOf('/assets/') === -1) return;
            sessionStorage.setItem(key, '1');
            var reload = function () {
              window.location.reload();
            };
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker
                .getRegistrations()
                .then(function (regs) {
                  return Promise.all(regs.map(function (r) {
                    return r.unregister();
                  }));
                })
                .catch(function () {})
                .finally(reload);
            } else {
              reload();
            }
          },
          true,
        );
      })();
    </script>
