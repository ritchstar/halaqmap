<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>لا يوجد اتصال</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #061018;
        color: #f4efe4;
        font-family: -apple-system, 'SF Arabic', 'Segoe UI', system-ui, sans-serif;
      }
      main {
        display: flex;
        min-height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2.5rem 1.5rem;
        text-align: center;
      }
      .mark {
        display: grid;
        height: 4.5rem;
        width: 4.5rem;
        place-items: center;
        border-radius: 1.25rem;
        border: 1px solid rgba(232, 197, 71, 0.4);
        background: rgba(232, 197, 71, 0.12);
        font-size: 1.6rem;
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
        color: #e8c547;
      }
      p {
        margin: 0;
        max-width: 23rem;
        line-height: 2;
        color: rgba(244, 239, 228, 0.72);
      }
      button {
        margin-top: 0.5rem;
        border: 0;
        border-radius: 999px;
        background: #e8c547;
        color: #061018;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 800;
        padding: 0.85rem 2.25rem;
      }
      button:active {
        background: #f0d36a;
      }
      small {
        color: rgba(244, 239, 228, 0.5);
        line-height: 2;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">⚡</span>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تعذّر فتح لوحات التشغيل. تحقق من الشبكة ثم أعد المحاولة.</p>
      <button type="button" id="retry">إعادة المحاولة</button>
      <small>لوحة مشغّلي خريطة الحل</small>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        window.location.replace('https://store.halaqmap.com/#/store/operators');
      });
    </script>
  </body>
</html>
